# Reel e caroselli di @fisioconfede, un contenuto alla volta (skill reel-social e carosello-social).
# 1. Porta i lavori della dashboard nel progetto privato (media/social/lavori).
# 2. Se la routine Claude ha preparato i dati di un lavoro ("dati_pronti"): render, controlli automatici
#    (zone libere dei social, contrasto, margini), musica, consegna alla dashboard ("Da approvare") e copia
#    di sicurezza nella release "social-finiti". Nei log non compare nessun testo dei contenuti.
name: Render social

# Lo avvia la Sveglia (sveglia.yml) quando un lavoro ha i dati pronti; i lavori dalla dashboard li porta anche lei.
on:
  workflow_dispatch:
    inputs:
      lavoro:
        description: "id del post (vuoto = il prossimo con i dati pronti)"
        required: false

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
  GENERATORE_TOKEN: ${{ secrets.GENERATORE_TOKEN }}
  MEDIA_REPO: piazzafedericofp-del/video-guide-media

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Progetto privato (solo la parte social)
        uses: actions/checkout@v4
        with:
          repository: piazzafedericofp-del/video-guide-media
          token: ${{ secrets.MEDIA_TOKEN }}
          path: media
          sparse-checkout: |
            social/lavori
            social/clip-qualita.json
            social/posa
            social/ritratto.png
            social/musica.json
            social/guide

      - name: Codice
        uses: actions/checkout@v4
        with:
          path: codice

      - name: Lavori dalla dashboard
        run: |
          python3 codice/scripts/social/sincronizza.py media
          cd media
          git config user.name "render-social"; git config user.email "render@users.noreply.github.com"
          git add -A social; git diff --cached --quiet || git commit -q -m "social: lavori dalla dashboard"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - name: Scegli il lavoro
        id: scelta
        run: |
          ID="${{ github.event.inputs.lavoro }}"
          [ -n "$ID" ] || ID=$(python3 codice/scripts/social/scegli.py media)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -n "$ID" ]; then
            echo "formato=$(jq -r .formato "media/social/lavori/$ID/dati.json")" >> "$GITHUB_OUTPUT"
            echo "Lavoro: $ID"
          else
            echo "Niente da montare"
          fi

      - name: Segna "in_render"
        if: steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          echo -n in_render > "social/lavori/$ID/stato"
          git add "social/lavori/$ID/stato"; git commit -q -m "social $ID: in render"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - uses: actions/setup-node@v4
        if: steps.scelta.outputs.id != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codice/package-lock.json

      - name: Strumenti
        if: steps.scelta.outputs.id != ''
        working-directory: codice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 libcups2 libgl1 libglib2.0-0 libegl1 libgles2 >/dev/null
          pip install -q pillow numpy librosa
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      # ---------------- Reel ----------------
      - name: Reel · clip, colore e misura dei testi
        if: steps.scelta.outputs.formato == 'reel'
        env:
          ID: ${{ steps.scelta.outputs.id }}
        working-directory: codice
        run: |
          set -euo pipefail
          D="../media/social/lavori/$ID/dati.json"
          cp "$D" public/dati.json
          CLIP=$(jq -r .clip "$D")
          mkdir -p girato out
          gh release download clip-social -R "$MEDIA_REPO" -p "$CLIP.*" -D girato < /dev/null
          SRC=$(ls girato/* | head -1)
          # Tagli facoltativi (riordino delle ripetizioni per far coincidere testi e movimento): [[da, a], …] in secondi della clip
          N=$(jq '.tagli // [] | length' "$D")
          # Bordi neri sui 4 lati, velocità di lettura, zoom entro la nitidezza vera della clip e tratti rovinati dalla pulizia
          # (audit del 29/10/2026): esito completo solo nel progetto privato (errore.txt), nei log pubblici niente testi
          # Posa del corpo (posa.yml): se la clip non ce l'ha ancora si calcola qui e si salva con la consegna
          POSA="../media/social/posa/$CLIP.json"
          if [ ! -f "$POSA" ]; then
            mkdir -p ../media/social/posa
            { pip install -q mediapipe && curl -sSfL "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task" -o /tmp/posa.task \
              && python3 scripts/social/posa.py "$SRC" /tmp/posa.task "$POSA"; } > /dev/null 2>&1 || echo "Posa non calcolata"
          fi
          CONPOSA=(); [ -f "$POSA" ] && CONPOSA=(--posa "$POSA")
          python3 scripts/social/controlla-reel.py "$D" --clip "$SRC" --qualita ../media/social/clip-qualita.json "${CONPOSA[@]}" > out/controlli.txt 2>&1 \
            || { echo "Controllo del Reel: da correggere"; exit 1; }
          # Sulle clip già compresse la nitidezza in più accentua i blocchi
          NITIDO=",unsharp=5:5:0.4"
          [ "$(jq -r --arg c "$CLIP" '.clip[$c].compressa // false' ../media/social/clip-qualita.json 2>/dev/null)" = "true" ] && NITIDO=""
          COLORE="scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=contrast=1.07:saturation=1.1:gamma=0.97,colorbalance=rs=0.03:bs=-0.03:rm=0.02:bm=-0.02${NITIDO},fps=30"
          if [ "$N" -gt 0 ]; then
            F=""; L=""
            for ((i=0; i<N; i++)); do
              DA=$(jq ".tagli[$i][0]" "$D"); A=$(jq ".tagli[$i][1]" "$D")
              F="$F[0:v]trim=$DA:$A,setpts=PTS-STARTPTS[t$i];"; L="$L[t$i]"
            done
            ffmpeg -nostdin -v error -i "$SRC" -filter_complex "${F}${L}concat=n=$N:v=1:a=0,$COLORE[v]" -map "[v]" -an -c:v libx264 -crf 14 -preset fast -pix_fmt yuv420p public/clip.mp4
          else
            ffmpeg -nostdin -v error -i "$SRC" -an -vf "$COLORE" -c:v libx264 -crf 14 -preset fast -pix_fmt yuv420p public/clip.mp4
          fi
          rm -rf girato
          DUR=$(jq -r .durata "$D")
          ffmpeg -nostdin -v error -f lavfi -i "color=black:s=1080x1920:r=30:d=$DUR" -c:v libx264 -pix_fmt yuv420p public/_nero.mp4
          node scripts/social/misura-reel.mjs out/misura
          # Esito completo solo nel progetto privato (errore.txt): nei log pubblici niente testi
          python3 scripts/social/controlla-zone.py out/misura >> out/controlli.txt 2>&1 || { echo "Controllo zone: testi fuori zona"; exit 1; }
          grep -E "^(Reel:|Tutto)" out/controlli.txt

      - name: Reel · render, musica e copertina
        if: steps.scelta.outputs.formato == 'reel'
        env:
          ID: ${{ steps.scelta.outputs.id }}
        working-directory: codice
        run: |
          set -euo pipefail
          D="../media/social/lavori/$ID/dati.json"
          # Brano prima del render: nel modello "momenti" gli stacchi vanno sul battito (skill reel-social, ritmo)
          DUR=$(jq -r .durata "$D")
          BRANO=$(jq -r .brano "$D")
          gh release download musica-social -R "$MEDIA_REPO" -p "$BRANO" -O brano.mp3 < /dev/null
          INIZIO=$(jq -r '.inizio_brano // empty' "$D")
          [ -n "$INIZIO" ] || INIZIO=$(python3 scripts/social/taglio-musica.py brano.mp3 "$DUR" | cut -d' ' -f1)
          python3 scripts/social/aggancia-battiti.py public/dati.json brano.mp3 "$INIZIO" > /dev/null
          npx remotion render src/social/index.ts Reel out/muto.mp4 --codec=h264 --crf=18 --log=error
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/muto.mp4)
          FINE=$(python3 -c "print(max(0, $DUR - 1.2))")
          ffmpeg -nostdin -v error -ss "$INIZIO" -t "$DUR" -i brano.mp3 -af "afade=t=in:d=0.15,afade=t=out:st=$FINE:d=1.2,loudnorm=I=-14:TP=-1.5:LRA=7" -ar 48000 -ac 2 musica.wav
          mkdir -p out/consegna
          ffmpeg -nostdin -v error -i out/muto.mp4 -i musica.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart out/consegna/video.mp4
          # Copertina (Instagram la usa nella griglia del profilo): composta se c'è props.copertina (modello "momenti",
          # scelta di Federico del 23/10: fotogramma coinvolgente, stretto, titolo sul petto), altrimenti fotogramma del gancio
          if [ "$(jq -r '.props.copertina // empty | type' "$D")" = "object" ]; then
            npx remotion still src/social/index.ts Copertina out/consegna/copertina.jpg --image-format=jpeg --jpeg-quality=92 --log=error
          else
            ffmpeg -nostdin -v error -ss "$(jq -r '.copertina // 1.2' "$D")" -i out/consegna/video.mp4 -frames:v 1 -q:v 2 out/consegna/copertina.jpg
          fi
          ffmpeg -nostdin -v error -i out/consegna/video.mp4 -vf "fps=1/2,scale=270:-1,tile=8x1" -frames:v 1 out/foglio.jpg
          cp out/consegna/video.mp4 "out/$ID.mp4"

      # ---------------- Carosello ----------------
      - name: Carosello · foto, render e controlli
        id: carosello
        if: steps.scelta.outputs.formato == 'carosello'
        env:
          ID: ${{ steps.scelta.outputs.id }}
        working-directory: codice
        run: |
          set -euo pipefail
          D="../media/social/lavori/$ID/dati.json"
          cp "$D" public/dati.json
          cp ../media/social/ritratto.png public/ritratto.png
          # Chiusura verso una video guida (28/10/2026): un movimento della guida, video e fotogramma fermo dall'archivio privato
          for G in $(jq -r '[.props.slide[]? | .guida? // empty | .video, .fermo] | .[]' "$D"); do cp "../media/social/guide/$G" "public/$G"; done
          mkdir -p out/consegna
          # Foto: girato, clip, immagine in dashboard (r2:) o generata con l'IA (ia, campo prompt)
          bash scripts/social/prepara-foto.sh "$ID" "$D"
          node scripts/social/misura-carosello.mjs Carosello out/consegna/c45
          node scripts/social/misura-carosello.mjs Carosello916 out/consegna/c916
          # Esito completo solo nel progetto privato (errore.txt): nei log pubblici niente testi
          { echo "== 4:5"; python3 scripts/social/controlla-carosello.py out/consegna/c45; } > out/controlli.txt 2>&1 || { echo "Controllo 4:5 non superato"; exit 1; }
          { echo "== 9:16"; python3 scripts/social/controlla-carosello.py out/consegna/c916; } >> out/controlli.txt 2>&1 || { echo "Controllo 9:16 non superato"; exit 1; }
          grep "Tutto a posto" out/controlli.txt | sed 's/:.*//' 
          # Slide animate per Instagram (barre, omini, chiusura con la guida): MP4 accanto alla JPEG con lo stesso numero
          node scripts/social/rendi-animate.mjs out/consegna/c45
          ffmpeg -nostdin -v error -i "out/consegna/c45/slide-%02d.jpg" -vf "scale=270:338,tile=8x1" -frames:v 1 out/foglio.jpg
          (cd out/consegna && zip -qr "../$ID.zip" c45 c916)
          # Copertina appena generata con l'IA: nessuno l'ha ancora vista (la routine scrive la descrizione prima che
          # esista). Non va in dashboard: torna alla routine, che la guarda e la conferma o la fa rigenerare (24/10/2026).
          if jq -e '[.foto[]? | select(.sorgente == "ia")] | length > 0' "$D" > /dev/null; then echo "verifica=1" >> "$GITHUB_OUTPUT"; fi

      - name: Copertina IA da verificare
        if: steps.carosello.outputs.verifica == '1'
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          L="social/lavori/$ID"
          cp ../codice/out/consegna/c45/slide-01.jpg "$L/copertina-slide.jpg"
          cp ../codice/out/consegna/c916/slide-01.jpg "$L/copertina-slide-916.jpg"
          cp ../codice/out/foglio.jpg "$L/foglio.jpg"
          echo -n da_verificare > "$L/stato"
          git add "$L"; git commit -q -m "social $ID: da_verificare (copertina IA)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      # ---------------- Storie (skill storie-social) ----------------
      # Zero token: 3 varianti × Instagram e Facebook dal materiale appena montato. Se non riescono il post esce lo stesso.
      - name: Storie
        if: steps.scelta.outputs.id != '' && steps.carosello.outputs.verifica != '1'
        continue-on-error: true
        env:
          ID: ${{ steps.scelta.outputs.id }}
        working-directory: codice
        run: bash scripts/social/rendi-storie.sh "${{ steps.scelta.outputs.formato }}" out/consegna "../media/social/lavori/$ID/dati.json"

      # ---------------- Consegna ----------------
      - name: Consegna alla dashboard
        if: steps.scelta.outputs.id != '' && steps.carosello.outputs.verifica != '1'
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          set -euo pipefail
          python3 codice/scripts/social/consegna.py "$ID" codice/out/consegna "media/social/lavori/$ID/dati.json" > /dev/null
          gh release upload social-finiti codice/out/$ID.* -R "$MEDIA_REPO" --clobber
          cd media
          cp ../codice/out/foglio.jpg "social/lavori/$ID/foglio.jpg"
          echo -n consegnato > "social/lavori/$ID/stato"; rm -f "social/lavori/$ID/errore.txt" "social/lavori/$ID/tentativi_render"
          git add "social/lavori/$ID" social/posa; git commit -q -m "social $ID: consegnato"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      # Due casi, per non far girare a vuoto la routine (24/10/2026):
      # - un controllo automatico non superato (testi fuori zona, contrasto…): "errore", la routine lo corregge UNA volta;
      # - un guasto tecnico (download, strumenti, render): non è un problema dei dati, la routine non serve. Si riprova
      #   il render una volta da solo; se fallisce di nuovo "errore_render" e avviso a Federico, senza altri giri.
      - name: Segna errore
        if: failure() && steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          L="social/lavori/$ID"
          { echo "Render fallito: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; cat ../codice/out/controlli.txt 2>/dev/null | grep -v " ok$" | tail -40; } > "$L/errore.txt"
          if grep -qE "✗|FUORI" ../codice/out/controlli.txt 2>/dev/null; then
            echo -n errore > "$L/stato"; MSG="Un controllo automatico non è passato: la routine lo corregge una volta da sola."
          else
            N=$(cat "$L/tentativi_render" 2>/dev/null || echo 0)
            if [ "$N" -lt 1 ]; then
              echo -n dati_pronti > "$L/stato"; echo -n $((N+1)) > "$L/tentativi_render"; MSG=""
            else
              echo -n errore_render > "$L/stato"; MSG="Il render non è riuscito due volte per un problema tecnico: è fermo, va guardato in una sessione."
            fi
          fi
          git add "$L"; git commit -q -m "social $ID: $(cat "$L/stato")"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done
          [ -z "$MSG" ] || python3 ../codice/scripts/social/avvisa.py "$ID" "$MSG" > /dev/null || true

      # Render annullato: i dati vanno bene, il lavoro torna in coda (non "errore", che farebbe ripartire la routine)
      - name: Rimetti in coda se annullato
        if: cancelled() && steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          echo -n dati_pronti > "social/lavori/$ID/stato"
          git add "social/lavori/$ID/stato"; git commit -q -m "social $ID: render annullato, di nuovo in coda"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - name: Giro successivo e sveglia
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C media pull -q || true
          if [ "${{ job.status }}" = "success" ] && [ -n "$(python3 codice/scripts/social/scegli.py media)" ]; then
            gh workflow run social.yml -R "${{ github.repository }}"
          fi
          # La routine può preparare il contenuto successivo
          gh workflow run sveglia.yml -R "${{ github.repository }}" || true
