# Render delle lezioni delle video guide, una alla volta.
# Lo avvia la Sveglia (sveglia.yml) quando una lezione ha lo stato "dati_pronti" (montaggio preparato dalla routine
# Claude): la monta dai girati 4K originali (release "girati") e salva il video finito nella release "restaurati".
# Nel codice e nei log non compare nessun contenuto delle guide.
name: Render lezione

on:
  workflow_dispatch:
    inputs:
      lezione:
        description: "id della lezione (vuoto = la prossima in coda)"
        required: false

concurrency:
  group: render
  cancel-in-progress: false

# GITHUB_TOKEN può avviare un nuovo giro di questo stesso flusso (catena che si autoalimenta)
permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
  MEDIA_REPO: piazzafedericofp-del/video-guide-media

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Progetto privato (solo catalogo, lezioni, musica)
        uses: actions/checkout@v4
        with:
          repository: piazzafedericofp-del/video-guide-media
          token: ${{ secrets.MEDIA_TOKEN }}
          path: media
          sparse-checkout: |
            catalogo.json
            lezioni
            musica

      - name: Codice (per scegliere la lezione)
        uses: actions/checkout@v4
        with:
          path: codice

      - name: Scegli la lezione
        id: scelta
        run: |
          ID="${{ github.event.inputs.lezione }}"
          [ -n "$ID" ] || ID=$(python3 codice/scripts/scegli-lezione.py media)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] && echo "Lezione: $ID" || echo "Niente in coda"

      - name: Segna "in_render"
        if: steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          git config user.name "render-video-guide"; git config user.email "render@users.noreply.github.com"
          echo -n in_render > "lezioni/$ID/stato"
          git add "lezioni/$ID/stato"; git commit -q -m "$ID: in render"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - uses: actions/setup-node@v4
        if: steps.scelta.outputs.id != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codice/package-lock.json

      - name: Strumenti
        if: steps.scelta.outputs.id != ''
        working-directory: codice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 libcups2 >/dev/null
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Scarica girati, dati e musica
        if: steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        working-directory: codice
        run: |
          set -euo pipefail
          L="../media/lezioni/$ID"
          cp "$L/dati.json" public/dati.json
          [ -d "$L/immagini" ] && cp "$L/immagini/"* public/ || true
          cp ../media/musica/an-open-top-car.mp3 musica.mp3
          python3 -c "
          import json
          l=[x for x in json.load(open('../media/catalogo.json'))['lezioni'] if x['id']=='$ID'][0]
          for i,s in enumerate(l['sorgenti']): print(i, ' '.join(s['file']))
          " > sorgenti.txt
          mkdir -p girato
          N=$(wc -l < sorgenti.txt)
          while read -r I FILES; do
            for f in $FILES; do gh release download girati -R "$MEDIA_REPO" -p "$f" -D girato < /dev/null; done
            # Pezzi di un girato oltre 2 GB: riuniti senza ricodifica
            : > girato/pezzi.txt; for f in $FILES; do echo "file '$f'" >> girato/pezzi.txt; done
            ffmpeg -nostdin -v error -f concat -safe 0 -i girato/pezzi.txt -map 0:v:0 -map 0:a:0 -c copy "girato/s$I.mov"
            for f in $FILES; do rm "girato/$f"; done
          done < sorgenti.txt
          if [ "$N" -eq 1 ]; then
            mv girato/s0.mov girato/intero.mov
          else
            # Più riprese nella stessa lezione: ognuna portata a 3840x2160 30 fps con qualità quasi trasparente,
            # poi messe in fila senza ricodifica. I tempi dei dati seguono questa fila (ripresa 2 dopo la 1, ecc.).
            : > girato/fila.txt
            for ((i=0; i<N; i++)); do
              ffmpeg -nostdin -v error -i "girato/s$i.mov" -map 0:v:0 -map 0:a:0 \
                -vf "scale=3840:2160:flags=lanczos,fps=30" -c:v libx264 -crf 10 -preset fast -pix_fmt yuv420p \
                -c:a aac -b:a 256k -ar 48000 "girato/n$i.mp4"
              rm "girato/s$i.mov"; echo "file 'n$i.mp4'" >> girato/fila.txt
            done
            ffmpeg -nostdin -v error -f concat -safe 0 -i girato/fila.txt -c copy girato/intero.mov
          fi

      - name: Prepara girato e colonna sonora
        if: steps.scelta.outputs.id != ''
        working-directory: codice
        run: |
          set -euo pipefail
          INIZIO=$(jq -r .inizioFile public/dati.json)
          DUR=$(jq -r '([.tratti[].a] | max) - .inizioFile + 0.5' public/dati.json)
          scripts/prepara-girato.sh girato/intero.mov "$INIZIO" "$DUR" lezione
          TRATTI=$(jq -r '.inizioFile as $i | [.tratti[] | "\(.da - $i):\(.a - $i)"] | join(" ")' public/dati.json)
          PRIMA=$(jq -r '.apertura.prima // 0' public/dati.json)
          MONT=$(jq -r '([.tratti[] | .a - .da] | add) + (.apertura.prima // 0)' public/dati.json)
          TOT=$(jq -r '([.tratti[] | .a - .da] | add) + .durataFinale + (.apertura.prima // 0)' public/dati.json)
          scripts/colonna.sh lezione musica.mp3 "$TOT" "$MONT" "$TRATTI" "" "$PRIMA"
          rm -rf girato

      - name: Render
        if: steps.scelta.outputs.id != ''
        working-directory: codice
        run: npx remotion render src/cloud/index.ts GuidaLezione out/lezione.mp4 --codec=h264 --crf=18 --log=error

      - name: Controlli e foglio di controllo
        if: steps.scelta.outputs.id != ''
        working-directory: codice
        run: |
          set -euo pipefail
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/lezione.mp4)
          A=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 out/lezione.mp4)
          [ "$A" = "audio" ] || { echo "manca l'audio"; exit 1; }
          echo "durata $D s"
          ffmpeg -nostdin -v error -i out/lezione.mp4 -vf "fps=1/$(python3 -c "print(max(1,round($D/8)))"),scale=480:-1,tile=4x2" -frames:v 1 out/foglio.jpg

      - name: Salva il video finito
        if: steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          set -euo pipefail
          cp codice/out/lezione.mp4 "codice/out/$ID.mp4"
          gh release upload restaurati "codice/out/$ID.mp4" -R "$MEDIA_REPO" --clobber
          cd media
          cp ../codice/out/foglio.jpg "lezioni/$ID/foglio.jpg"
          echo -n pronto > "lezioni/$ID/stato"; rm -f "lezioni/$ID/errore.txt"
          git add "lezioni/$ID"; git commit -q -m "$ID: pronto"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - name: Segna errore
        if: failure() && steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          echo -n errore > "lezioni/$ID/stato"
          echo "Render fallito: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "lezioni/$ID/errore.txt"
          git add "lezioni/$ID"; git commit -q -m "$ID: errore"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      # Render annullato (a mano o da GitHub): i dati vanno bene, la lezione torna in coda invece di restare "in_render"
      - name: Rimetti in coda se annullato
        if: cancelled() && steps.scelta.outputs.id != ''
        env:
          ID: ${{ steps.scelta.outputs.id }}
        run: |
          cd media
          echo -n dati_pronti > "lezioni/$ID/stato"
          git add "lezioni/$ID/stato"; git commit -q -m "$ID: render annullato, di nuovo in coda"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done

      - name: Giro successivo e sveglia
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C media pull -q || true
          if [ "${{ job.status }}" = "success" ] && [ -n "$(python3 codice/scripts/scegli-lezione.py media)" ]; then
            gh workflow run render.yml -R "${{ github.repository }}"
          fi
          # La routine può preparare la lezione successiva
          gh workflow run sveglia.yml -R "${{ github.repository }}" || true
