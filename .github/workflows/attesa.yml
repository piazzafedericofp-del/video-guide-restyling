# Attesa della routine (24/10/2026). La Sveglia lo avvia subito dopo aver svegliato una routine Claude: aspetta che
# la routine finisca (un lavoro passato a dati_pronti / bloccato / da_verificare e nessuno "in_preparazione": così vede
# anche le routine che durano meno di un controllo), poi avvia di nuovo
# la Sveglia, che fa partire il render e il lavoro successivo. Così la catena routine → render → lavoro successivo non
# dipende dal timer di GitHub, che salta giri anche per ore. Gira gratis (repo pubblico) e non consuma token Claude.
# Nei log compaiono solo conteggi, mai contenuti.
name: Attesa routine

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "social | lezione"
        required: true

concurrency:
  group: attesa-${{ inputs.tipo }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}

jobs:
  attesa:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Progetto privato (solo stati)
        uses: actions/checkout@v4
        with:
          repository: piazzafedericofp-del/video-guide-media
          token: ${{ secrets.MEDIA_TOKEN }}
          path: media
          sparse-checkout: |
            lezioni
            social/lavori

      - name: Aspetta che la routine cominci e finisca
        env:
          TIPO: ${{ inputs.tipo }}
        run: |
          [ "$TIPO" = social ] && GLOB='media/social/lavori/*/stato' || GLOB='media/lezioni/*/stato'
          stati() { git -C media fetch -q origin main && git -C media checkout -q -B main origin/main; grep -H . $GLOB 2>/dev/null | sort; }
          stati > /tmp/inizio.txt
          # Controllo ogni minuto, al massimo 2 ore; se la routine non tocca nessun lavoro in 30 minuti, rilancia comunque
          for giro in $(seq 1 120); do
            sleep 60
            stati > /tmp/ora.txt
            prep=$(grep -c ':in_preparazione$' /tmp/ora.txt || true)
            esiti=$(comm -13 /tmp/inizio.txt /tmp/ora.txt | grep -cE ':(dati_pronti|bloccato|da_verificare)$' || true)
            toccati=$(comm -13 /tmp/inizio.txt /tmp/ora.txt | wc -l)
            if [ "$prep" -eq 0 ] && [ "$esiti" -gt 0 ]; then echo "routine finita (minuto $giro, $esiti esiti)"; break; fi
            if [ "$giro" -ge 30 ] && [ "$toccati" -eq 0 ]; then echo "nessun lavoro toccato in 30 minuti"; break; fi
          done

      - name: Sveglia (render e lavoro successivo)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sveglia.yml -R "${{ github.repository }}" -f dopo_routine=1
